<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Web Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="/">Mahmoud Abdulhaq</a>
    <nav class="nav" aria-label="Primary">
      <a href="/" aria-current="page">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main class="container stack">
    <h1>Mahmoud Abdulhaq</h1>
    <p class="text-soft">A small demo page styled by <code>styles.css</code>.</p>

    <div class="grid">
      <article class="card">
        <h2 class="card__title">First card</h2>
        <p class="card__body">This card uses the new <code>.card</code> component from the shared stylesheet.</p>
        <div class="card__footer">
          <a class="btn btn--primary" href="#">Primary</a>
          <a class="btn btn--secondary" href="#">Secondary</a>
        </div>
      </article>

      <article class="card">
        <h2 class="card__title">Second card</h2>
        <p class="card__body">Cards sit in a responsive <code>.grid</code> that wraps automatically.</p>
        <div class="card__footer">
          <a class="btn btn--ghost" href="#">Ghost</a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
